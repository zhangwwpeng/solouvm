[project]
name = "solouvm"
version = "0.1.0"
description = "Generate UVM verification frameworks and runners from Python configuration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhangwwpeng" }]
dependencies = []

[project.scripts]
solouvm = "solouvm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solouvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
