[project]
name = "solouvm"
version = "0.1.0"
description = "Generate UVM verification frameworks and runners from Python configuration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhangwwpeng" }]
dependencies = []

[project.scripts]
solouvm = "solouvm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solouvm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["*.py", "*.pyi"]
extend-exclude = ["solouvm/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PYI", "TRY", "PLW"]
# TRY003：短的错误信息直接写在 raise 处即可；RUF001-003：允许中文标点出现在字符串和注释里
ignore = ["TRY003", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["solouvm"]
